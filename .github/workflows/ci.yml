name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: make test

      - name: Compile Python modules
        run: python3 -m compileall -q spakoi

      - name: Check JavaScript syntax
        run: |
          node --check extension/spakoi@victoriaappdeveloper.github.io/extension-legacy.js
          node --check extension/spakoi@victoriaappdeveloper.github.io/src/controller.js
          node --check extension/spakoi@victoriaappdeveloper.github.io/src/indicator.js

      - name: Test staged installation
        run: make install DESTDIR="$RUNNER_TEMP/spakoi-install"
