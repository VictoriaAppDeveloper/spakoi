name: Release checks

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source
        run: make test

      - name: Build deterministic source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar --prefix="spakoi-${RELEASE_TAG}/" "$GITHUB_SHA" \
            | gzip -n > "spakoi-${RELEASE_TAG}.tar.gz"
          sha256sum "spakoi-${RELEASE_TAG}.tar.gz" \
            > "spakoi-${RELEASE_TAG}.tar.gz.sha256"

      - name: Store verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spakoi-${{ github.ref_name }}
          path: |
            spakoi-${{ github.ref_name }}.tar.gz
            spakoi-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
